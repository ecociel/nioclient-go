services:
  nio-check:
    image: nio-check:sqlite
    environment:
      - RUST_LOG=debug
      - GRPC_LISTEN_ADDRESS=0.0.0.0:50052
      - GRPC_REQUIRE_CLIENT_AUTH=false
      - DB_CONNECTION=sqlite:/var/db/check.sqlite
      - NAMESPACES_PATH=/etc/check/namespaces/bootstrap.yaml
    ports:
      - "50052:50052"
    configs:
      - source: namespaces
        target: /etc/check/namespaces/bootstrap.yaml
    volumes:
      - ./test:/var/db

  nio-client:
    image: nio-client:sqlite
    environment:
      - RUST_LOG=debug
      - HTTP_LISTEN_ADDRESS=0.0.0.0:8080
      - SESSION_GRPC_LISTEN_ADDRESS=0.0.0.0:50053
      - SESSION_GRPC_REQUIRE_CLIENT_AUTH=false
      - DB_CONNECTION=sqlite:/var/db/client.sqlite
      - NIO_CHECK_URI=http://nio-check:50052
      - BASE_URI=http://localhost:8090/auth
      - AUDIENCE=nioclient-go
      - POLICIES_PATH=/etc/client/policies.yaml
      - TENANTS_PATH=/etc/client/tenants.yaml
      - TENANT_ENCRYPTION_KEY=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    ports:
      - "8090:8080"
      - "50053:50053"
    configs:
      - source: policies
        target: /etc/client/policies.yaml
      - source: tenants
        target: /etc/client/tenants.yaml
    volumes:
      - ./test:/var/db
    depends_on:
      nio-check:
        condition: service_started

configs:
  namespaces:
    content: |
      name: project
      relations:
        - name: owner
          rewrite: { type: this }
        - name: editor
          rewrite: { type: this }
        - name: viewer
          rewrite: { type: this }
        - name: project.get
          rewrite:
            type: union
            children:
              - { type: computed_userset, relation: owner }
              - { type: computed_userset, relation: editor }
              - { type: computed_userset, relation: viewer }
        - name: project.update
          rewrite:
            type: union
            children:
              - { type: computed_userset, relation: owner }
              - { type: computed_userset, relation: editor }
        - name: project.delete
          rewrite: { type: computed_userset, relation: owner }
      ---
      name: article
      relations:
        - name: editor
          rewrite: { type: this }
        - name: viewer
          rewrite: { type: this }
        - name: article.get
          rewrite:
            type: union
            children:
              - { type: computed_userset, relation: editor }
              - { type: computed_userset, relation: viewer }
        - name: article.update
          rewrite: { type: computed_userset, relation: editor }

  policies:
    content: |
      ns: iam
      obj: root
      rel: admin
      users:
        - local:admin@local.local/1:123456
      ---
      ns: project
      obj: p42
      rel: owner
      users:
        - local:admin@local.local/1:123456
      ---
      ns: project
      obj: p42
      rel: editor
      users:
        - local:anna@local.local/2:123456
      ---
      ns: project
      obj: p42
      rel: viewer
      users:
        - local:bob@local.local/3:123456
      ---
      ns: project
      obj: p65
      rel: viewer
      users:
        - local:admin@local.local/1:123456
        - local:anna@local.local/2:123456
        - local:bob@local.local/3:123456
      ---
      ns: article
      obj: a1
      rel: viewer
      users:
        - local:bob@local.local/3:123456

  tenants:
    content: |
      id: default
      local: {}
